<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Pages App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }
        h1 {
            color: #333;
        }
        ul {
            background: white;
            padding: 20px;
            border-radius: 8px;
            list-style: none;
            box-shadow: 0 0 10px #ccc;
        }
        li {
            margin: 10px 0;
        }
        a {
            text-decoration: none;
            color: #007bff;
            font-size: 18px;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Welcome to My GitHub Pages</h1>
    <p>Select a file or app to open:</p>

    <ul>
        <!-- Replace these with your actual file names -->
        <li><a href="app.html">Open App</a></li>
        <li><a href="index.js">View index.js</a></li>
        <li><a href="style.css">View style.css</a></li>
    </ul>
</body>
</html>
